// 기존 Account와 버전·MVC·Resource Server 구성을 맞추고 AI 작업만 담당합니다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.msa'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4'
    }
}

dependencies {
    // 빌더 코드는 컴파일 시 생성하며 운영 실행 파일에는 Lombok 의존성을 포함하지 않습니다.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Prometheus 수집 형식은 Boot BOM이 관리하는 Micrometer 버전으로 제공합니다.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    runtimeOnly 'org.postgresql:postgresql'
    // 외부 GA 분석 저장소는 Google 공식 클라이언트로 조회하고 로컬 업무 DB는 JPA로 접근합니다.
    implementation 'com.google.cloud:google-cloud-bigquery:2.76.0'
    // Account와 같은 SDK 버전으로 S3 업로드 권한·객체 검증을 구현합니다.
    implementation platform('software.amazon.awssdk:bom:2.57.3')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 동시성·원자성은 H2 대신 격리된 실제 PostgreSQL로 검증합니다.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// PostgreSQL 통합 테스트는 Docker가 필요하며 기존 개발 DB를 변경하지 않습니다.
tasks.named('test') {
    useJUnitPlatform()
}
tasks.named('jar') {
    enabled = false
}
