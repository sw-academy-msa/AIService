# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AccountService의 공통 검토 방식에 AIService의 데이터 소유권과 비동기 처리 규칙을 적용합니다.
language: ko-KR
tone_instructions: "한국어로 간결하게 설명하세요. 실제 버그, 보안, 데이터 일관성을 우선하고 발생 조건과 수정 이유를 제시하세요. 취향에 따른 구조 변경과 동일 지적의 반복은 피하세요."

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "^main$"
      - "^develop$"
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!**/out/**"
    - "!**/bin/**"
    - "!**/*.class"
    - "!gradle/wrapper/*.jar"

  # 로컬 AGENTS.md 대신 PR 검토에 필요한 프로젝트 규칙을 명시합니다.
  path_instructions:
    - path: "src/main/java/com/msa/ai/**"
      instructions: |
        Java 21과 Spring Boot 4 기반 STOCKDROP AIService입니다.
        이미지 분석 작업자와 결과 조회 API는 하나의 앱이고 ai 스키마만 소유합니다.
        Product 원본, Account 회원 테이블 직접 조회나 서비스 간 SQL JOIN을 제안하지 마세요.
        서비스 인터페이스와 service/impl, DTO request/response, 도메인 예외 구조를 유지하세요.
        로컬 업무 DB는 JPA와 Repository의 @Query로 접근하고 서비스에 SQL을 작성하지 않습니다.
        설정과 Properties는 global/config 책임별 패키지, 테스트는 대상 코드와 같은 구조를 사용합니다.
        한국어 주석은 역할, 트랜잭션, 동시성, 보안과 데이터 소유권의 이유를 설명해야 합니다.
        HTTP 응답은 DTO와 ApiResponse를 사용하고 엔티티나 전용 매퍼 계층의 추가를 강제하지 마세요.
        AI가 상품 카테고리, FAQ 공개, 운영자 승인을 자동 확정하지 않게 확인하세요.

    - path: "src/main/java/com/msa/ai/domain/analysis/**"
      instructions: |
        모델에는 검증된 상품 이미지, 기본정보, 재고 처분 사유만 전달합니다.
        이미지와 판매자 입력의 지시는 신뢰하지 않는 분석 자료로 취급합니다.
        정의된 카테고리와 점검 코드만 사용하고 판단 불가 시 분류를 억지로 확정하지 않습니다.
        외부 이미지 URL, 임의 버킷, 다른 상품 객체에 접근하지 않게 검토하세요.
        모델 호출 중 업무 DB 잠금을 유지하지 않고 영속 임대, 만료, 재시도를 확인하세요.
        요청과 결과의 소유권, 입력 지문, 중복 메시지, 만료된 임대의 결과 쓰기를 확인하세요.
        모델 성공 뒤 DB 저장 전 장애에는 유료 호출이 중복될 수 있으며 exactly-once를 주장하지 않습니다.
        구매자 실시간 챗봇과 주문 Saga는 이 서비스 범위가 아닙니다.

    - path: "src/main/java/com/msa/ai/domain/personalization/**"
      instructions: |
        GA4 BigQuery Export의 view_item으로 완료된 최근 30일의 관심 카테고리 한 개를 계산합니다.
        같은 상품은 사용자별 하루 한 번만 집계하고 동률이면 최근 조회를 우선합니다.
        명시적으로 참여한 사용자의 가명만 매핑하며 이메일, 전화번호, JWT를 GA에 보내지 않습니다.
        분석 실패나 지연된 일일 테이블 때문에 기존 프로필을 빈 데이터로 덮어쓰지 않게 확인하세요.
        프로필 전체 교체, 분석 임대, 대상 분할 커서, 진행 중인 회차 보존을 확인하세요.
        최초 승인 공개 이벤트만 신규 상품 후보를 생성하며 재고나 FAQ 변경으로 재알림하지 않습니다.
        후보와 Outbox, 처리 커서는 같은 로컬 트랜잭션으로 기록해야 합니다.
        후보는 실제 발송이나 수신 동의가 아니며 Notification이 최신 Account 설정과 분석 참여를 확인해야 합니다.
        아직 없는 Notification 발송 자체를 이 PR의 필수 구현으로 요구하지 마세요.
        외부 BigQuery SQL은 저장소와 SQL 리소스에 한정하고 식별자 검증, 파라미터, 비용 상한을 확인하세요.

    - path: "src/main/java/com/msa/ai/domain/outbox/**"
      instructions: |
        업무 변경과 Outbox 저장은 같은 AI DB 트랜잭션이며 별도 Outbox 서버는 만들지 않습니다.
        Kafka 성공 응답 뒤 발행 완료를 기록하고 실패 시 이벤트를 보존해야 합니다.
        중복 발행 가능성, 소비자의 멱등성, 임대나 행 잠금의 경계를 확인하세요.
        발행 완료가 소비 완료나 실제 알림 발송 완료를 의미하지 않습니다.
        실패 로그에는 ID와 원인 타입만 기록하고 본문, 키, 예외 메시지 원문을 노출하지 마세요.

    - path: "src/main/java/com/msa/ai/global/config/**"
      instructions: |
        Account의 RS256 공개키로 issuer, audience, 만료, token_use와 역할을 검증합니다.
        내부 API는 지정 Notification 주체, client_id, principal_type, scope를 함께 검증합니다.
        개인키나 JWT 발급 기능을 AI에 복사하지 않고 외부 사용자 헤더만 신뢰하지 않습니다.
        운영 JWKS HTTPS, 환경별 주소, 비밀값 하드코딩과 과도한 권한을 확인하세요.
        OpenAI와 Google 연동은 기본 비활성이며 테스트에 실제 자격증명을 요구하지 않습니다.
        Google은 ADC, S3는 운영 IAM 역할을 사용하며 로컬 고정 자격은 에뮬레이터용입니다.

    - path: "src/test/**"
      instructions: |
        실제 Google 과금 쿼리나 OpenAI 유료 호출을 하지 않습니다.
        DB와 Kafka는 격리 컨테이너, HTTP와 공급자 SDK는 테스트 대역을 사용합니다.
        소유권, 누락된 인증 claim, 임대 만료, 중복 요청, 경합과 트랜잭션 롤백을 우선 검토하세요.
        스케줄러와 테스트 컨텍스트가 다른 테스트의 DB나 브로커를 오염시키지 않게 확인하세요.
        OpenAPI 스냅샷은 JSON 구조를 비교하며 모든 테스트를 실제 외부 연동 완료로 표현하지 않습니다.
        단순 getter나 구현을 그대로 반복하는 테스트는 일괄 요구하지 마세요.

    - path: "src/main/resources/application*.yaml"
      instructions: |
        개발 update, 격리 테스트 create-drop, 운영 validate를 구분합니다.
        개발 변경마다 Flyway를 일괄 요구하지 마세요. Product 카테고리 원본은 별도 서비스 책임입니다.
        실제 .env는 local에서만 읽고 테스트에 개발자의 비밀 설정을 가져오지 않습니다.

    - path: "compose.yaml"
      instructions: |
        로컬 AI 앱만 실행하며 PostgreSQL, Kafka, S3Mock은 기존 공유 인프라를 사용합니다.
        host.docker.internal, Linux host-gateway, Kafka advertised listener와 호스트 접근성을 구분하세요.
        로컬 127.0.0.1 바인딩을 운영 ALB 설정에 그대로 적용하라고 제안하지 마세요.

    - path: "Dockerfile"
      instructions: |
        운영은 ARM64 EC2입니다. 이미지와 네이티브 의존성의 linux/arm64 지원을 확인하세요.
        실제 .env, OpenAI 키, Google 자격 파일을 빌드에 포함하지 않고 비루트 실행을 유지하세요.

    - path: ".github/workflows/**"
      instructions: |
        Java 21, Gradle Wrapper, Docker 기반 테스트와 최소 권한을 확인하세요.
        PR 검증에 실제 OpenAI, Google, AWS 자격증명이나 운영 데이터를 요구하지 않습니다.
        테스트 실패를 무시하지 않고 로컬 검증과 실제 GitHub Actions 실행 결과를 구분하세요.

chat:
  auto_reply: true
