# AI는 자체 스키마만 관리하며 Product 원본 테이블에 연결하지 않습니다.
spring:
  application:
    name: ai-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: ai
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
    admin:
      auto-create: false
server:
  port: ${SERVER_PORT:8086}
  forward-headers-strategy: none
ai:
  ga:
    enabled: ${AI_GA_ENABLED:false}
    project-id: ${GA_BIGQUERY_PROJECT_ID:}
    dataset: ${GA_BIGQUERY_DATASET:}
    location: ${GA_BIGQUERY_LOCATION:}
    zone: ${GA_PROPERTY_TIME_ZONE:Asia/Seoul}
    lookback-days: 30
    maximum-bytes-billed: ${GA_MAXIMUM_BYTES_BILLED:1073741824}
    maximum-rows: ${GA_MAXIMUM_ROWS:100000}
  personalization:
    enabled: ${AI_PERSONALIZATION_ENABLED:false}
    notification-subject: ${NOTIFICATION_SERVICE_SUBJECT:}
  consumer-enabled: ${AI_CONSUMER_ENABLED:false}
  worker-enabled: ${AI_WORKER_ENABLED:false}
  outbox:
    publisher-enabled: ${AI_OUTBOX_PUBLISHER_ENABLED:false}
  vision:
    enabled: ${AI_VISION_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_VISION_MODEL:gpt-6.1-sol}
  images:
    bucket: ${PRODUCT_IMAGES_BUCKET:}
    region: ${PRODUCT_IMAGES_REGION:ap-northeast-2}
    local: ${AI_IMAGES_LOCAL:false}
    endpoint: ${PRODUCT_IMAGES_ENDPOINT:}
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:stockdrop-api}
    jwk-set-uri: ${ACCOUNT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${SERVICE_INSTANCE_ID:${random.uuid}}
    non-secure-port: ${SERVICE_PORT:${server.port}}
    health-check-url-path: /actuator/health
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 업무 JWT와 분리된 읽기 전용 수집 토큰입니다. 빈 값이면 메트릭 접근을 거부합니다.
monitoring:
  scrape-token: ${MONITORING_SCRAPE_TOKEN:}

  # Outbox 집계 스케줄은 명시 활성화하며 테스트/미설정 환경에서 DB를 주기 조회하지 않습니다.
  outbox-enabled: ${MONITORING_OUTBOX_ENABLED:false}
